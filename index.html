<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sufi Detector: find out which LLM is really answering behind any OpenAI- or Anthropic-compatible API. No login; your key stays in your browser.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Sufi Detector">
  <meta property="og:description" content="Which LLM is really behind your API? Fingerprint any model in one click.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sufi Detector">
  <meta name="referrer" content="no-referrer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sufi Detector — which LLM is really behind your API?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: #9a9a9a; transition: opacity .35s ease; }
    #splash .mark { width: 64px; height: 64px; border-radius: 20px; background: #fff; box-shadow: 0 0 40px rgba(255,255,255,.15);
      animation: pulse 1.4s ease-in-out infinite; }
    #splash .name { color: #f5f5f5; font-weight: 800; font-size: 20px; letter-spacing: -.4px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); opacity: .8; } }
  </style>
</head>
<body>
  <div id="splash"><div class="mark"></div><div class="name">Sufi Detector</div><div>loading…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
