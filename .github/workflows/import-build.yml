name: Import Build Artifacts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download import-assets --repo Sufiyan65889/OpenLLM-Detector --pattern '*.zip' --dir /tmp --clobber
      - name: Unpack into repo
        run: unzip -o /tmp/*.zip -d .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Add build artifacts from release asset"; git push; fi
